<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>无线第五代 · CoT 路由台（设计档预览件）</title>
<style>
  :root{
    --bg:#0d1014; --panel:#151a21; --panel2:#1b2129; --line:#25303c; --fg:#e6edf3; --dim:#8b9aab;
    --t1:#3fb950; --t2:#58a6ff; --t3:#d29922; --accent:#58a6ff; --warn:#f0883e;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  html[data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#f0f3f7; --line:#dde3ea; --fg:#161b22; --dim:#5c6b7a;
    --t1:#1a7f37; --t2:#0969da; --t3:#9a6700; --accent:#0969da; --warn:#bc4c00;
    --shadow:0 8px 26px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;padding:20px 16px 60px}
  header{max-width:1080px;margin:0 auto 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:12.5px}
  header .spacer{flex:1}
  button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  textarea,input[type=number],input[type=text]{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;resize:vertical}
  textarea{min-height:74px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .samples button{font-size:12px;padding:5px 9px;border-radius:20px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .tier{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--panel2);position:relative;overflow:hidden}
  .tier.on{border-color:currentColor;box-shadow:0 0 0 1px currentColor inset}
  .tier[data-t=T1]{color:var(--t1)} .tier[data-t=T2]{color:var(--t2)} .tier[data-t=T3]{color:var(--t3)}
  .tier b{display:block;font-size:14px;color:inherit}
  .tier .rule{color:var(--fg);opacity:.82;font-size:12.5px;margin-top:6px;color:inherit}
  .tier .shape{color:var(--dim);font-size:12px;margin-top:6px}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:600;color:#fff}
  .badge[data-t=T1]{background:var(--t1)} .badge[data-t=T2]{background:var(--t2)} .badge[data-t=T3]{background:var(--t3)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px;color:var(--dim)}
  .chip.hit{border-color:var(--accent);color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi div{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .kpi small{color:var(--dim);display:block;font-size:11.5px;letter-spacing:.4px}
  .bar{height:26px;border-radius:7px;background:linear-gradient(90deg,var(--accent),transparent);position:relative;overflow:hidden}
  .gantt{display:grid;gap:6px}
  .gantt .g{display:grid;grid-template-columns:150px 1fr 62px;gap:9px;align-items:center;font-size:12.5px}
  .gantt .track{height:12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
  .gantt .fill{height:100%;background:var(--accent);border-radius:6px 0 0 6px}
  .muted{color:var(--dim);font-size:12px;margin-top:8px}
  .flag{display:inline-block;font-size:11.5px;border:1px dashed var(--warn);color:var(--warn);border-radius:7px;padding:2px 8px;margin-left:6px}
  code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
  @media (max-width:560px){ .gantt .g{grid-template-columns:110px 1fr 54px} }
</style>
</head>
<body>
<header>
  <h1>无线第五代 · CoT 路由台</h1>
  <span class="sub">编程需求三档判定 → 形态 / 检索 / 预览件 / 工时 / 人民币</span>
  <span class="spacer"></span>
  <button id="theme">切换明暗</button>
</header>

<div class="wrap">
  <section class="card">
    <h2>① 输入需求（改一个字，下面全量重算）</h2>
    <textarea id="req" spellcheck="false">我想做一个长线项目：多端记账 App（Android + iOS + Web + 后台），要持续维护和迭代，先给我混合方案</textarea>
    <div class="samples" id="samples"></div>
    <div class="row">
      <label>模块 <input type="number" id="modules" min="1" max="40" value="1" style="width:74px"></label>
      <label>平台 <input type="number" id="platforms" min="1" max="6" value="1" style="width:74px"></label>
      <label>外部集成 <input type="number" id="integrations" min="0" max="12" value="0" style="width:74px"></label>
      <label>AI 费率 <input type="number" id="aiHourly" min="1" max="2000" value="45" style="width:86px"></label>
      <label>人工费率 <input type="number" id="humanHourly" min="1" max="5000" value="150" style="width:86px"></label>
      <label>AI 占比 <input type="number" id="aiShare" min="0" max="1" step="0.05" value="0.7" style="width:74px"></label>
      <button id="reset">回到默认</button>
    </div>
  </section>

  <section class="card">
    <h2>② 三档路由（命中档高亮）</h2>
    <div class="tiers" id="tiers"></div>
    <div class="row" style="margin-top:12px">
      <span id="verdict" class="badge" data-t="T1">T1</span>
      <span id="verdictWhy" class="muted" style="margin:0"></span>
    </div>
    <div class="chips" id="evidence"></div>
  </section>

  <section class="card">
    <h2>③ 交给 AI 自己做：工时与预算</h2>
    <div class="kpi">
      <div><small>计费人时</small><span class="big" id="hours">—</span> <span class="muted">人时</span></div>
      <div><small>日历工期</small><span class="big" id="cal" style="font-size:19px">—</span></div>
      <div><small>混合档预算</small><span class="big" id="money">—</span> <span class="muted">元</span></div>
      <div><small>复杂度系数</small><span class="big" id="cx">—</span></div>
    </div>
    <div class="muted" id="flags"></div>
    <table id="moneyTable"><tbody></tbody></table>
    <div class="gantt" id="gantt"></div>
    <div class="muted" id="assume"></div>
    <div id="maint"></div>
  </section>

  <section class="card">
    <h2>④ 注入条款（命中触发词时拼进系统提示的一节）</h2>
    <pre class="muted" id="clause" style="white-space:pre-wrap;margin:0;font-size:12.5px"></pre>
  </section>
</div>

<script>
<!--IG5_CORE-->

// ── 浏览器外壳：只做渲染与表单，不含任何判档/估算口径 ──────────────────
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("zh-CN", { maximumFractionDigits: 2 });

const SAMPLES = [
  ["报错怎么改", "这个报错怎么改：TypeError: Cannot read properties of undefined (reading 'map')"],
  ["设计记账界面", "帮我设计一个个人记账 App 的界面，要有预算环和月历，先出可点的预览件"],
  ["长线多端项目", "我想做一个长线项目：多端记账 App（Android + iOS + Web + 后台），要持续维护和迭代，给我混合方案"],
  ["上线+合规", "公司要上线一套监控系统，部署到生产环境，还要合规和等保，排期怎么定"],
];

function renderTiers(active) {
  $("tiers").innerHTML = TIERS.map((t) => {
    const m = TIER_META[t];
    return `<div class="tier ${t === active ? "on" : ""}" data-t="${t}">
      <b>${t} · ${m.name}</b>
      <div class="rule">${m.rule}</div>
      <div class="shape">形态：${m.shape}<br>问法：${m.questionPolicy}</div>
    </div>`;
  }).join("");
}

function renderGantt(e) {
  const total = e.phases.reduce((s, p) => s + p.hours, 0) || 1;
  $("gantt").innerHTML = `<div class="muted" style="margin-top:12px">相位分解（合计 ${fmt(total)} 人时 ≈ ${e.calendarText}）</div>` +
    e.phases.map((p) => `<div class="g"><span>${p.name}</span>
      <span class="track"><span class="fill" style="width:${Math.max(4, (p.hours / total) * 100)}%"></span></span>
      <span class="num">${fmt(p.hours)} 人时</span></div>`).join("");
}

function render() {
  const text = $("req").value;
  const opts = {
    modules: +$("modules").value || 1,
    platforms: +$("platforms").value || 1,
    integrations: +$("integrations").value || 0,
    rate: {
      aiHourly: +$("aiHourly").value || 45,
      humanHourly: +$("humanHourly").value || 150,
      aiShare: Math.min(1, Math.max(0, +$("aiShare").value)),
    },
  };
  const a = analyze(text, opts);
  const e = a.estimate;

  renderTiers(a.tier);
  $("verdict").dataset.t = a.tier;
  $("verdict").textContent = `${a.tier} · ${a.meta.name}`;
  $("verdictWhy").textContent = `${a.why.rule}｜${a.meta.shape}`;
  $("evidence").innerHTML = a.why.evidence.length
    ? a.why.evidence.map((k) => `<span class="chip hit">${k}</span>`).join("")
    : `<span class="chip">无命中信号 → 按最短路径直给</span>`;

  $("hours").textContent = fmt(e.billedHours);
  $("cal").textContent = e.calendarText;
  $("money").textContent = "¥" + fmt(e.money.blended);
  $("cx").textContent = e.complexity;
  $("flags").innerHTML = [
    a.needsSearch ? `<span class="flag">需网络检索设计方案</span>` : "",
    a.needsPreview ? `<span class="flag">需 HTML 预览件</span>` : "",
    `人时区间 ${e.hours.min}–${e.hours.max}（含应急 ${Math.round(e.contingency * 100)}% + 验收 ${Math.round(e.acceptance * 100)}%）`,
  ].join("");

  $("moneyTable").querySelector("tbody").innerHTML = [
    ["AI 代理价", `¥${fmt(e.money.ai)}`, `¥${e.rate.aiHourly}/人时 × ${fmt(e.billedHours)} 人时`],
    ["混合价（默认口径）", `¥${fmt(e.money.blended)}`, `加权 ¥${e.blended}/人时（AI ${Math.round(e.rate.aiShare * 100)}% + 人工 ${Math.round((1 - e.rate.aiShare) * 100)}%）`],
    ["全人工价", `¥${fmt(e.money.human)}`, `¥${e.rate.humanHourly}/人时`],
  ].map(([k, v, note]) => `<tr><th>${k}</th><td class="num">${v}</td><td class="muted">${note}</td></tr>`).join("");

  renderGantt(e);
  $("assume").textContent = "口径：" + e.assumptions.join("｜");
  $("maint").innerHTML = e.maintenance
    ? `<div class="muted">维护期（长线档）：¥${fmt(e.maintenance.monthly)}/月 → 6 个月 ¥${fmt(e.maintenance.months6)} · 12 个月 ¥${fmt(e.maintenance.months12)}｜${e.maintenance.node}</div>`
    : "";
  $("clause").textContent = renderRouterClause();
  window.__lastAnalysis = a;
}

$("samples").innerHTML = SAMPLES.map(([label], i) => `<button data-i="${i}">${label}</button>`).join("");
$("samples").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  $("req").value = SAMPLES[+b.dataset.i][1];
  render();
});
$("reset").addEventListener("click", () => {
  $("modules").value = 1; $("platforms").value = 1; $("integrations").value = 0;
  $("aiHourly").value = RATE_DEFAULT.aiHourly; $("humanHourly").value = RATE_DEFAULT.humanHourly;
  $("aiShare").value = RATE_DEFAULT.aiShare;
  render();
});
$("theme").addEventListener("click", () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === "dark" ? "light" : "dark";
});
["req", "modules", "platforms", "integrations", "aiHourly", "humanHourly", "aiShare"].forEach((id) => {
  $(id).addEventListener("input", render);
});
render();
</script>
</body>
</html>
