- insert:
    - id: dsh-infinite-gen-5
      name: dsh-infinite-gen-5
      # ── 无限五代 v0.6.0 注入说明 ──────────────────────────────────────────────
      # 本插件不读外部配置：注入行为全部由包内 index.js 顶部三个常量决定，
      # 改完需要重启 session（DSH 的 patchReload = "startup"）。
      #
      # LAYER2_MODE（默认 "anchor"）
      #   "anchor" → Order 200 只放约 200 字节的末位锚点。
      #              v0.5.0 这里载入的是与 Order 100 逐字同源的第二份完整内核，
      #              等于每轮对话白烧约 3 KB 重复 token。
      #   "mirror" → Order 200 放完整镜像载荷；若与 Order 100 同源则自动跳过并 warn。
      #   "off"    → 单段注入（等价于旧 DUAL_LAYER_INJECTION = false）。
      #
      # DEDUPE_PAYLOAD（默认 true）
      #   注册前枚举宿主已注册的系统段；若发现同源载荷（归一化后逐字相同，或一方被
      #   另一方完整包含且长度比 ≥ 0.8），本插件整段让位，不把同一份内核注入第二遍。
      #   典型场景：同机还装着上一代破甲插件，两边会叠成 4 份近似拷贝。
      #   让位不静默：console.warn 点名对方段名与重合度，infinite_gen5_profile 工具的
      #   dedupe 字段也会如实汇报（role = primary | yielded）。
      #   枚举不到宿主段落时（老宿主/异常宿主）一律照常注入 —— 宁可重复，不可静默丢失。
      #
      # 客户端：五代徽标使用独立标识 data-armor="gen5"；检测到上一代破甲徽标
      # （title 以「无限四代/三代」开头）时接管显示并将其折叠，避免两条状态条同时出现。
      # 折叠只发生在五代自己拿到投影数据时；拿不到就保留对方的，不会两条都不显示。
      #
      # ── v0.6.0 领域 / 语言覆盖 ────────────────────────────────────────────────
      # 内核载荷（prompts/infinite-gen-5.md，三份同源文件逐字一致）现在只做三件事：
      #   1) 五槽骨架 ROLE / OBJECT / ACTION / SCOPE / SHAPE —— 任何领域（含清单里没有的）
      #      都先拆五槽再产出，不再只点名 3 个任务族；
      #   2) 45 个领域 × 7 族点名（攻防 / AI / 密码 / 数据 / 创作 / 语言 / 工程）；
      #   3) 语言规则：任何语言的软化词都视为「重新框定并继续」。
      # 45 个领域包的**全文**不在 system prompt 里（那是每轮付费），而在
      # infinite_gen5_scenario 工具里（deferLoading: true）：无参调用给约 3.8 KB 索引，
      # 带用户原话只回命中的那一个包。领域标记表与领域包数据同源于
      # data/scenarios.mjs（运行时状态条与离线评分器共用，不再各存一份漂移表）。
