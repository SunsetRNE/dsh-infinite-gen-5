# 无限五代 · 提交/PR 门禁
#
# 本插件是零依赖（只用 Node 内建模块），所有自检都离线、确定性、无需 API Key，
# 因此 CI 不必 npm install —— checkout + 装 Node 就能把仓库里全部断言跑一遍。
#
# verify:all 聚合了：语法检查、版本一致性、内核全量回归（gen5/gen51）、注入去重、
# 注入强度（真宿主演习台；runner 上没有 DSH 时会自动 SKIP 并以 0 退出，不是失败）、
# 56 域数据层、真宿主领域工具挂载、状态条行为、环境探测、离线评测闭环 + 基线回归门禁。
# 其中 gate:eval 会拿 tests/eval-baseline.json 拦指标回退；基线确有正当提升时，
# 本地跑 npm run baseline:eval 重写并一起提交。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 必须拉全历史：CHANGELOG 生成器按提交标题切版本段（verify_release_notes 会现场生成一遍
      # 并断言「版本段数合理」）。默认的 fetch-depth: 1 只有一个提交 —— 生成结果只剩 1 段，
      # 历史类断言在 CI 上必假红（本机全历史绿、runner 红）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 护栏 · 自检脚本不得硬导宿主绝对路径
        run: |
          # 2026-09-27 的教训：verify_scenario_tool.mjs 曾 `import {...} from "/usr/local/lib/node_modules/
          # @deepseek-ai/cordis/..."`，本机绿、runner 上必炸（ERR_MODULE_NOT_FOUND），连挂 10 次 CI。
          # 正确写法：先 locateHost()（--host= / IG5_DSH_ROOT / 常见安装位），找不到就 SKIP + exit 0。
          if grep -rnE '^[[:space:]]*(import|export)[^\n]*"(/usr/local|/opt|/home/runner)' scripts/ --include='*.mjs'; then
            echo "::error::自检脚本硬写了宿主绝对路径 import —— runner 上必然 ERR_MODULE_NOT_FOUND"
            exit 1
          fi
          echo "✓ 没有硬写宿主绝对路径的 import"
      - name: 全量自检
        run: npm run verify:all
